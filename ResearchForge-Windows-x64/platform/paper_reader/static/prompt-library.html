<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResearchForge · 提示词库</title><meta name="theme-color" content="#fbfcfb" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)"><link rel="icon" href="/ui/favicon.svg"><script src="/ui/boot.js"></script><link rel="stylesheet" href="/ui/tokens.css"><link rel="stylesheet" href="/ui/shell.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/prompt-library.css"><script src="/ui/shell.js" defer></script><script src="/static/prompt-library.js" defer></script></head>
<body>
<aside class="sidebar prompt-sidebar" id="prompt-sidebar" aria-label="提示词库导航">
<a class="brand" id="workspace-home" href="/"><span class="brand-mark">R<span>f</span></span><span>ResearchForge<small>研究工作台</small></span></a>
<!-- workspace-navigation -->
<button id="new-prompt" class="new-reading"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-plus"/></svg>新建提示词</button>
<nav class="prompt-views" aria-label="收藏与回收站"><button data-view="all" aria-current="true"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-library-big"/></svg>全部提示词 <span id="count-all">0</span></button><button data-view="favorites"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-star"/></svg>我的收藏 <span id="count-favorites">0</span></button><button data-view="trash"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-trash-2"/></svg>回收站 <span id="count-trash">0</span></button></nav>
<div class="category-heading">分类目录</div><nav id="categories" class="prompt-categories" aria-label="提示词分类"></nav>
<div class="sidebar-bottom"><a id="backup-library" class="nav-button"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-download"/></svg>导出提示词备份</a><button id="restore-library" class="nav-button"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-folder-input"/></svg>恢复备份</button><p class="storage-note">保存在本机，不调用 API</p><div class="rf-utility"><a class="rf-utility-link" href="/setup"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-circle-help"/></svg>使用指南</a><button class="icon-button rf-theme-toggle" type="button" data-rf-theme-toggle aria-label="切换外观"></button></div></div>
</aside>
<div class="workspace prompt-workspace"><header class="topbar"><button id="prompt-menu" class="icon-button mobile" aria-label="展开提示词分类"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-panel-left"/></svg></button><div class="breadcrumb"><span>提示词库</span><span>/</span><strong id="prompt-crumb">全部提示词</strong></div><button class="rf-kbar-trigger" type="button" data-rf-kbar aria-label="打开命令面板"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-search"/></svg><span class="rf-kbar-label">搜索</span><kbd data-rf-kbd>Ctrl K</kbd></button></header>
<main class="prompt-main"><div class="prompt-heading"><div><h1>把好用的提示词，留下来。</h1><p>按用途整理，随时复用。</p></div><div class="heading-actions"><button id="desktop-import" class="btn secondary"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-folder-input"/></svg>从配置文件夹导入</button><button id="upload-prompts" class="btn primary"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-file-up"/></svg>导入文件</button></div></div>
<div class="prompt-toolbar"><label class="prompt-search"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-search"/></svg><input id="prompt-search" type="search" maxlength="500" placeholder="搜索标题、正文、标签或备注" aria-label="搜索提示词"></label><span id="result-count" class="muted"></span></div>
<div id="page-error" class="notice" role="alert" hidden></div>
<div class="collection-layout"><section aria-label="提示词列表" class="collection-list"><div id="prompt-list"><div class="rf-skeleton-list" aria-label="正在读取"><span class="rf-skeleton lg"></span><span class="rf-skeleton lg"></span><span class="rf-skeleton lg w80"></span></div></div><div class="prompt-pagination" id="pagination" hidden><button id="previous-page" class="text-button">上一页</button><span id="page-label"></span><button id="next-page" class="text-button">下一页</button></div></section>
<section class="prompt-detail" id="prompt-detail" aria-label="提示词详情"></section></div>
<p class="collection-note">这里是收藏夹；实际运行的提示词在各模块中设置。</p>
</main></div>
<dialog id="prompt-editor-dialog" class="dialog collection-editor"><form id="prompt-form"><div class="dialog-head"><div><h2 id="editor-heading">新建提示词</h2><p>每次保存都会留存版本。</p></div><button type="button" id="close-editor" class="icon-button" aria-label="关闭提示词编辑"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-x"/></svg></button></div><div class="dialog-body"><div class="form-grid"><label class="wide">标题<input id="edit-title" required maxlength="240" placeholder="例如：引言首段 · 政策与典型事实"></label><label>分类<input id="edit-category" list="category-options" maxlength="240" placeholder="例如：论文写作 / 引言"></label><label>标签<input id="edit-tags" placeholder="用逗号分隔，例如：引言、英文、实证"></label><label class="wide">使用说明 / 备注<textarea id="edit-notes" rows="2" maxlength="5000" placeholder="什么时候用，需要补充哪些材料…"></textarea></label><label class="wide">提示词正文<textarea id="edit-content" required maxlength="300000" rows="16" spellcheck="false" placeholder="把提示词粘贴在这里…"></textarea></label></div><div class="editor-bottom"><label><input id="edit-favorite" type="checkbox"> 加入收藏</label><span id="edit-count"></span></div><p id="editor-error" class="inline-message error" role="alert"></p></div><div class="dialog-footer"><span class="muted">保留原文中的占位符与换行。</span><button id="save-prompt" type="submit" class="btn primary">保存提示词</button></div></form></dialog>
<datalist id="category-options"></datalist>
<dialog id="desktop-dialog" class="dialog collection-import"><div class="dialog-head"><div><h2>从配置文件夹导入</h2><p id="desktop-root"></p></div><button class="icon-button" data-close="desktop-dialog" aria-label="关闭桌面导入"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-x"/></svg></button></div><div class="dialog-body"><p class="muted">按目录分类，重复文件自动跳过。</p><div class="import-select-all"><label><input id="desktop-all" type="checkbox" checked> 选择全部新文件</label><span id="desktop-count"></span></div><div id="desktop-files"></div><p id="desktop-errors" class="inline-message error" role="alert"></p></div><div class="dialog-footer"><span class="muted">支持 TXT、MD、JSON · 单文件最大 2 MB</span><button id="confirm-desktop" class="btn primary">导入选中提示词</button></div></dialog>
<dialog id="versions-dialog" class="dialog collection-versions"><div class="dialog-head"><div><h2>历史版本</h2><p>恢复会另存为新版本。</p></div><button class="icon-button" data-close="versions-dialog" aria-label="关闭历史版本"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-x"/></svg></button></div><div class="dialog-body"><label>选择版本<select id="version-select"></select></label><h3 id="version-title"></h3><pre id="version-content"></pre><p id="version-error" class="inline-message error" role="alert"></p></div><div class="dialog-footer"><span id="version-note" class="muted"></span><button id="restore-version" class="btn primary">恢复这个版本</button></div></dialog>
<dialog id="restore-dialog" class="dialog"><form id="restore-form"><div class="dialog-head"><div><h2>恢复提示词库备份</h2><p>合并备份，已有提示词保持不变。</p></div><button type="button" class="icon-button" data-close="restore-dialog" aria-label="关闭备份恢复"><svg class="icon" aria-hidden="true"><use href="/ui/icons.svg#i-x"/></svg></button></div><div class="dialog-body"><label>选择本平台导出的 JSON 备份<input id="restore-file" type="file" accept=".json" required></label><p class="muted">恢复前自动备份，≤ 40 MB。</p><p id="restore-error" class="inline-message error" role="alert"></p></div><div class="dialog-footer"><span></span><button type="submit" class="btn primary">合并恢复</button></div></form></dialog>
<input id="prompt-files" type="file" accept=".txt,.md,.markdown,.json" multiple hidden><div id="toast" role="status" hidden></div>
</body></html>
